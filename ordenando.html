<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ordenação de Números</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="ordenando.css" />
  </head>
  <body>
    <div
      class="container min-vh-100 d-flex justify-content-center align-items-center"
    >
      <div class="card shadow-sm app-card">
        <div class="card-body">
          <h1 class="mb-4">Ordenação de Números</h1>
          <div class="input-group mb-4">
            <input
              type="number"
              id="numero"
              class="form-control"
              placeholder="Digite um número"
            />
            <button id="btnAdicionar" class="btn btn-dark">Adicionar</button>
          </div>
          <div class="list-box">
            <strong>Lista Atual</strong>
            <div id="listaNumeros" class="mt-2"></div>
            <div id="contador" class="mt-3 text-muted"></div>
          </div>
          <fieldset class="mb-4">
            <legend class="fs-6">Algoritmo de Ordenação</legend>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="algoritmo"
                value="bubble"
                checked
              />
              <label class="form-check-label"> Bubble Sort </label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="algoritmo"
                value="selection"
              />
              <label class="form-check-label"> Selection Sort </label>
            </div>
            <div class="form-check">
              <input
                class="form-check-input"
                type="radio"
                name="algoritmo"
                value="quick"
              />
              <label class="form-check-label"> Quick Sort </label>
            </div>
          </fieldset>
          <div class="d-flex gap-2">
            <button id="btnOrdenar" class="btn btn-primary">Ordenar</button>
            <button id="btnMisturar" class="btn btn-outline-secondary">
              Misturar
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="ordenando.js"></script>
  </body>
</html>
